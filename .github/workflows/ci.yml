name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install zsh, nushell and ghr
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl -L https://github.com/nushell/nushell/releases/download/0.113.1/nu-0.113.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.113.1-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          curl -fsSL https://raw.githubusercontent.com/chenyukang/ghr/main/install.sh | GHR_INSTALL_DIR=/usr/local/bin sh
      - name: Install Oh My Zsh
        run: |
          sudo mkdir -p /usr/share/oh-my-zsh
          sudo git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git /usr/share/oh-my-zsh
      - run: cargo test --workspace --all-features

  test-tmux-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install tmux, zsh, nushell and ghr
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh
          curl -L https://github.com/nushell/nushell/releases/download/0.113.1/nu-0.113.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.113.1-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          curl -fsSL https://raw.githubusercontent.com/chenyukang/ghr/main/install.sh | GHR_INSTALL_DIR=/usr/local/bin sh
      - name: Install Oh My Zsh
        run: |
          sudo mkdir -p /usr/share/oh-my-zsh
          sudo git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git /usr/share/oh-my-zsh
      - run: TERM2_BACKEND=tmux cargo test --workspace --all-features

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install zsh, nushell and ghr
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl -L https://github.com/nushell/nushell/releases/download/0.113.1/nu-0.113.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.113.1-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          curl -fsSL https://raw.githubusercontent.com/chenyukang/ghr/main/install.sh | GHR_INSTALL_DIR=/usr/local/bin sh
      - name: Install Oh My Zsh
        run: |
          sudo mkdir -p /usr/share/oh-my-zsh
          sudo git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git /usr/share/oh-my-zsh
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Build server
        run: cargo build -p term2-api --bin term2-server
      - name: Run E2E tests
        run: cd e2e && ./run.sh

  e2e-tmux-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install tmux, zsh, nushell and ghr
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux zsh
          curl -L https://github.com/nushell/nushell/releases/download/0.113.1/nu-0.113.1-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.113.1-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          curl -fsSL https://raw.githubusercontent.com/chenyukang/ghr/main/install.sh | GHR_INSTALL_DIR=/usr/local/bin sh
      - name: Install Oh My Zsh
        run: |
          sudo mkdir -p /usr/share/oh-my-zsh
          sudo git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git /usr/share/oh-my-zsh
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Build server
        run: cargo build -p term2-api --bin term2-server
      - name: Run E2E tests with tmux backend
        run: cd e2e && TERM2_BACKEND=tmux ./run.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Audit e2e dependencies (npm)
        working-directory: ./e2e
        run: npm audit --audit-level=high

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/rust
            p/security-audit
            p/owasp-top-ten

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan for secrets (gitleaks 8.30.1, pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz gitleaks
          ./gitleaks detect --no-banner --redact


  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  deploy:
    needs: [fmt, clippy, test, test-tmux-legacy, e2e, e2e-tmux-legacy, audit, deny, sast, gitleaks, zizmor]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy placeholder
        run: |
          echo "Deployment step for term2.lucanian.app"
          echo "Current strategy: systemd + Caddy on the VPS"
